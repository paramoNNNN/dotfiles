config-version = 2
start-at-login = true
after-startup-command = ['exec-and-forget /usr/bin/open -a Ghostty']
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 15
automatically-unhide-macos-hidden-apps = false
focus-follows-mouse.enabled = true

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.right = 10
outer.top = 10
outer.bottom = 10

[mode.main.binding]
alt-f = 'fullscreen'
ctrl-alt-t = 'layout accordion tiles'
alt-p = 'layout tiles horizontal vertical'
alt-shift-x = 'exec-and-forget /usr/bin/open -a "Digital Color Meter"'
ctrl-alt-v = 'layout floating tiling'

ctrl-alt-r = 'exec-and-forget /usr/bin/open -g cleanshot://capture-area'
ctrl-alt-w = 'exec-and-forget /usr/bin/open -g cleanshot://capture-window'
ctrl-alt-f = 'exec-and-forget /usr/bin/open -g cleanshot://record-screen'
ctrl-alt-a = 'exec-and-forget /usr/bin/open -g cleanshot://all-in-one'

alt-h = ['focus left', 'move-mouse window-force-center']
alt-l = ['focus right', 'move-mouse window-force-center']
alt-k = ['focus up', 'move-mouse window-force-center']
alt-j = ['focus down', 'move-mouse window-force-center']
alt-shift-h = 'move left'
alt-shift-l = 'move right'
alt-shift-k = 'move up'
alt-shift-j = 'move down'
alt-ctrl-minus = 'resize smart -50'
alt-ctrl-equal = 'resize smart +50'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'
alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
alt-shift-0 = 'move-node-to-workspace --focus-follows-window 10'

[mode.resize.binding]
left = 'resize width -50'
right = 'resize width +50'
up = 'resize height +50'
down = 'resize height -50'
enter = 'mode main'
esc = 'mode main'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
b = ['balance-sizes', 'mode main']
left = ['join-with left', 'mode main']
right = ['join-with right', 'mode main']
up = ['join-with up', 'mode main']
down = ['join-with down', 'mode main']

[[on-window-detected]]
if.app-id = 'com.bitwarden.desktop'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'
