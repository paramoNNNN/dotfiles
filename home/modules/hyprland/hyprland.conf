autogenerated = 0

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,highres,auto,1.25

xwayland {
  force_zero_scaling = true
}

###################
### MY PROGRAMS ###
###################

$terminal = ghostty
$fileManager = nautilus
$menu = wofi --show drun


#################
### AUTOSTART ###
#################

exec-once = waybar & hyprpaper & $terminal
exec-once = hypridle
exec-once = clipse -listen

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GDK_SCALE,1.5
env = GDK_BACKEND,wayland

#####################
### LOOK AND FEEL ###
#####################

general { 
    gaps_in = 5
    gaps_out = 10

    border_size = 0
    resize_on_border = false 

    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 15
    active_opacity = 1.0
    inactive_opacity = 1.0

    layerrule = blur,wofi
    layerrule = blur,zen
    blur {
        enabled = true
        size = 10
        passes = 3
        popups = true
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    animation = windows, 1, 5, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc { 
    force_default_wallpaper = 0
}

#############
### INPUT ###
#############

input {
    kb_layout = us,ir
    kb_variant =
    kb_model =
    kb_options=grp:win_space_toggle
    kb_rules =

    repeat_rate = 40
    repeat_delay = 200

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = true
        scroll_factor = 0.25
        clickfinger_behavior = true
        tap-to-click = false
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_distance = 600
    workspace_swipe_min_speed_to_force = 2
}

####################
### KEYBINDINGSS ###
####################

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Toggle group
bind = $mainMod, t, togglegroup

# Toggle fullscreen
bind = $mainMod, f, fullscreen
 
# Toggle clipse
bind = CONTROL_L $mainMod, c, exec, alacritty --class clipse -e 'clipse'

# Screenshot a window
bind = CONTROL_L $mainMod, w, exec, hyprshot -m window

# Screenshot a region
bind = CONTROL_L $mainMod, r, exec, hyprshot -m region

# Screenrecord a region
bind = CONTROL_L $mainMod, f, exec, wl-screenrec -g "$(slurp)" -f /home/taha/Videos/record.mp4
bind = CONTROL_L $mainMod, s, exec, pkill --signal SIGINT -f wl-screenrec

# Lock
bind = CONTROL_L $mainMod, L, exec, hyprlock

bindle=, XF86AudioRaiseVolume, exec, pamixer -i 5
bindle=, XF86AudioLowerVolume, exec, pamixer -d 5
bindle=, XF86MonBrightnessUp, exec, bri --up
bindle=, XF86MonBrightnessDown, exec, bri --down
bindle=, XF86Search, exec, launchpad
bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=, XF86AudioPlay, exec, playerctl play-pause # the stupid key is called play , but it toggles 
bindl=, XF86AudioNext, exec, playerctl next 
bindl=, XF86AudioPrev, exec, playerctl previous

# Open 1Password
bind = $mainMod, code:51, exec, 1password


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrulev2 = suppressevent maximize, class:.*

# Clipse
windowrulev2 = float,class:(clipse)
windowrulev2 = size 1000 652,class:(clipse)

# 1Password
windowrulev2 = float, title:(1Password)
windowrulev2 = size 70% 70%, title:(1Password)
windowrulev2 = center, title:(1Password)

